<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UltrasTec AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Import Pixelify Sans pixel font -->
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f4f9;
            --surface-color: #ffffff;
            --text-main: #000000;
            --text-secondary: #000000;
            --border-color: #000000;
            --accent-blue: #000000;
        }

        /* Force pixel font and pure black color on everything */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Pixelify Sans', sans-serif !important; 
            color: #000000 !important;
        }
        
        html, body { 
            height: 100%; 
            height: 100dvh; 
            width: 100%; 
            overflow: hidden; 
        }

        body { 
            background: var(--bg-color); 
            display: flex; 
            flex-direction: column; 
        }

        /* Sidebar Drawer */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .sidebar-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: -300px;
            width: 280px;
            height: 100%;
            background: var(--surface-color);
            z-index: 101;
            box-shadow: 2px 0 12px rgba(0,0,0,0.1);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            padding: 16px;
            border-right: 2px solid #000;
        }
        .sidebar.open {
            transform: translateX(300px);
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .new-chat-btn {
            background: #ffffff;
            color: #000000;
            border: 2px solid #000000;
            padding: 10px 16px;
            border-radius: 0px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            margin-bottom: 20px;
        }
        .new-chat-btn:hover { background: #000000; color: #ffffff !important; }
        .new-chat-btn:hover span { color: #ffffff !important; }

        .sidebar-section-title {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .recent-chats-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .recent-chat-item {
            padding: 10px 12px;
            border-radius: 0px;
            font-size: 1rem;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .recent-chat-item:hover { background: #e0e0e0; }
        .recent-chat-item.active { background: #d0d0d0; font-weight: bold; }

        /* Header */
        header { 
            padding: 12px 16px; 
            background: var(--bg-color); 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 8px;
        }
        .menu-btn:hover { background: rgba(0,0,0,0.05); }

        .header-title { 
            font-size: 1.1rem; 
            font-weight: 600; 
        }

        /* Workspace & Chat */
        .workspace { 
            flex: 1; 
            overflow-y: auto; 
            padding: 16px; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            -webkit-overflow-scrolling: touch;
        }

        .welcome-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 16px;
            max-width: 600px;
            padding: 20px;
        }

        .welcome-title {
            font-size: 1.8rem;
            font-weight: 600;
            background: none !important;
            -webkit-background-clip: initial !important;
            -webkit-text-fill-color: #000000 !important;
            line-height: 1.4;
        }

        .chat-container { width: 100%; max-width: 768px; display: flex; flex-direction: column; gap: 24px; padding-bottom: 20px; }

        .msg-row { display: flex; gap: 12px; width: 100%; opacity: 0; transform: translateY(10px); animation: fadeInUp 0.3s ease forwards; }
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-row.user { justify-content: flex-end; }
        .msg-bubble { padding: 12px 16px; border-radius: 0px; border: 2px solid #000; max-width: 85%; font-size: 1.05rem; line-height: 1.6; word-break: break-word; white-space: pre-wrap; background-color: #ffffff; }
        .user .msg-bubble { background-color: #ffffff; border-color: #000; }
        .system .msg-bubble { background-color: transparent; border: none; width: 100%; padding: 0; }

        .msg-bubble img {
            max-width: 100%;
            border-radius: 0px;
            margin-top: 10px;
            display: block;
        }

        .msg-bubble video {
            max-width: 100%;
            border: 2px solid #000;
            border-radius: 0px;
            margin-top: 10px;
            display: block;
        }

        .gemini-loader {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: none !important;
            -webkit-background-clip: initial !important;
            -webkit-text-fill-color: #000000 !important;
            font-weight: 600;
            font-size: 1.05rem;
        }

        /* Input Box */
        .input-wrapper { 
            padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); 
            width: 100%; 
            max-width: 800px; 
            margin: 0 auto; 
            background: var(--bg-color); 
            flex-shrink: 0;
        }

        .pill-container { 
            background: var(--surface-color); 
            border-radius: 0px; 
            padding: 8px 12px; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            border: 2px solid #000000;
        }

        .pill-container input[type="text"] { 
            flex: 1; 
            border: none; 
            outline: none; 
            font-size: 1rem; 
            background: transparent; 
            min-width: 0;
            padding: 4px 0;
        }
        .pill-container input::placeholder { color: #000000; opacity: 0.6; }

        .action-btn, .send-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .action-btn {
            font-size: 1.2rem;
            padding: 8px;
        }
        .action-btn:hover { background: rgba(0,0,0,0.05); }

        .action-btn.listening {
            background: rgba(0, 0, 0, 0.1);
        }

        .send-btn { 
            background: #000000; 
            width: 36px; 
            height: 36px; 
            border-radius: 0px; 
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff !important; 
        }
        .send-btn svg { stroke: #ffffff !important; }
        .send-btn:active { background: #444; }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="menu-btn" id="sidebar-close">☰</button>
            <div class="header-title" style="font-size: 1rem;">UltrasTec</div>
        </div>
        <button class="new-chat-btn" id="new-chat-btn">
            <span>+</span> New chat
        </button>
        <div class="sidebar-section-title">Recent</div>
        <div class="recent-chats-list" id="recent-chats-list"></div>
    </aside>

    <header>
        <div class="header-left">
            <button class="menu-btn" id="menu-trigger" title="Main menu">☰</button>
            <div class="header-title">UltrasTec</div>
        </div>
    </header>

    <main class="workspace" id="workspace">
        <div class="welcome-container" id="welcome-container">
            <div class="welcome-title">Hi, what's on your mind?</div>
        </div>
        <div class="chat-container" id="chat-container"></div>
    </main>

    <footer class="input-wrapper">
        <div class="pill-container">
            <input type="file" id="file-input" accept="image/*" style="display: none;">
            <button class="action-btn" id="add-file-btn" title="Add file">+</button>
            <input type="text" id="cmd-input" placeholder="Ask UltrasTec..." autocomplete="off">
            <button class="action-btn" id="mic-btn" title="Use microphone">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </button>
            <button class="send-btn" id="send-trigger" type="button" title="Send">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="19" x2="12" y2="5"></line>
                    <polyline points="5 12 12 5 19 12"></polyline>
                </svg>
            </button>
        </div>
    </footer>

    <script>
        let chats = []; // Array of chat objects: { id, title, messages }
        let currentChatId = null;

        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const menuTrigger = document.getElementById('menu-trigger');
        const sidebarClose = document.getElementById('sidebar-close');
        const newChatBtn = document.getElementById('new-chat-btn');
        const recentChatsList = document.getElementById('recent-chats-list');
        const welcomeContainer = document.getElementById('welcome-container');
        const chatContainer = document.getElementById('chat-container');
        const cmdInput = document.getElementById('cmd-input');
        const sendTrigger = document.getElementById('send-trigger');
        const micBtn = document.getElementById('mic-btn');
        const fileInput = document.getElementById('file-input');
        const addFileBtn = document.getElementById('add-file-btn');

        function toggleSidebar(open) {
            if (open) {
                sidebar.classList.add('open');
                sidebarOverlay.classList.add('open');
            } else {
                sidebar.classList.remove('open');
                sidebarOverlay.classList.remove('open');
            }
        }

        menuTrigger.addEventListener('click', () => toggleSidebar(true));
        sidebarClose.addEventListener('click', () => toggleSidebar(false));
        sidebarOverlay.addEventListener('click', () => toggleSidebar(false));

        newChatBtn.addEventListener('click', () => {
            currentChatId = null;
            chatContainer.innerHTML = '';
            welcomeContainer.style.display = 'flex';
            renderSidebar();
            toggleSidebar(false);
        });

        addFileBtn.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    appendMessage(`<img src="${uploadEvent.target.result}" alt="Imported Image" />`, 'user', true);
                };
                reader.readAsDataURL(file);
            }
        });

        function renderSidebar() {
            recentChatsList.innerHTML = '';
            chats.forEach(chat => {
                const item = document.createElement('div');
                item.className = `recent-chat-item ${chat.id === currentChatId ? 'active' : ''}`;
                item.innerText = chat.title;
                item.addEventListener('click', () => {
                    currentChatId = chat.id;
                    renderSidebar();
                    renderActiveChat();
                    toggleSidebar(false);
                });
                recentChatsList.appendChild(item);
            });
        }

        function renderActiveChat() {
            chatContainer.innerHTML = '';
            const activeChat = chats.find(c => c.id === currentChatId);
            if (!activeChat || activeChat.messages.length === 0) {
                welcomeContainer.style.display = 'flex';
                return;
            }
            welcomeContainer.style.display = 'none';
            activeChat.messages.forEach(msg => {
                appendMessageDOM(msg.text, msg.sender, msg.isHtml);
            });
        }

        function appendMessageDOM(text, sender, isHtml = false) {
            welcomeContainer.style.display = 'none';
            const row = document.createElement('div');
            row.className = `msg-row ${sender}`;
            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';

            if (isHtml) {
                bubble.innerHTML = text;
            } else {
                bubble.innerText = text;
            }

            row.appendChild(bubble);
            chatContainer.appendChild(row);
            const workspace = document.getElementById('workspace');
            workspace.scrollTop = workspace.scrollHeight;
            return bubble;
        }

        async function appendMessage(text, sender, isHtml = false) {
            if (!currentChatId) {
                const newChat = {
                    id: Date.now(),
                    title: text.length > 25 ? text.substring(0, 25) + '...' : text,
                    messages: []
                };
                chats.unshift(newChat);
                currentChatId = newChat.id;
                renderSidebar();
                saveChatToCloud(newChat);
            }

            const activeChat = chats.find(c => c.id === currentChatId);
            if (activeChat) {
                activeChat.messages.push({ text, sender, isHtml });
                // If it's the first message update title if needed
                if (activeChat.messages.length === 1 && sender === 'user') {
                    activeChat.title = text.length > 25 ? text.substring(0, 25) + '...' : text;
                    renderSidebar();
                }
                saveChatToCloud(activeChat);
            }

            return appendMessageDOM(text, sender, isHtml);
        }

        sendTrigger.addEventListener('click', handleSend);
        cmdInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleSend();
        });

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            micBtn.addEventListener('click', () => {
                try {
                    recognition.start();
                } catch (e) {}
            });

            recognition.onstart = () => {
                micBtn.classList.add('listening');
                cmdInput.placeholder = "Listening...";
            };

            recognition.onresult = (event) => {
                const speechToText = event.results[0][0].transcript;
                cmdInput.value = speechToText;
            };

            recognition.onerror = () => {
                micBtn.classList.remove('listening');
                cmdInput.placeholder = "Ask UltrasTec...";
            };

            recognition.onend = () => {
                micBtn.classList.remove('listening');
                cmdInput.placeholder = "Ask UltrasTec...";
            };
        } else {
            micBtn.style.display = 'none';
        }


        // ===== Supabase: anonymous sign-in + private chats (no personal info) =====
        let supabaseClient = null;
        let currentUserId = null;

        try {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(
                    'https://bzhqvqngqzskguweyxwh.supabase.co',
                    'sb_publishable_r73COh8lzDtnG5jxhRLvUg_lJK6jVV7'
                );
            }
        } catch (e) {
            console.error('Supabase init error', e);
        }

        async function ensureAnonymousUser() {
            if (!supabaseClient) return null;
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session?.user?.id) {
                    currentUserId = session.user.id;
                    return currentUserId;
                }
                // No personal info – anonymous only
                const { data, error } = await supabaseClient.auth.signInAnonymously();
                if (error) throw error;
                currentUserId = data?.user?.id || null;
                return currentUserId;
            } catch (e) {
                console.error('Anonymous sign-in failed', e);
                return null;
            }
        }

        async function loadChatsFromCloud() {
            if (!supabaseClient) return;
            const uid = await ensureAnonymousUser();
            if (!uid) return;
            try {
                const { data, error } = await supabaseClient
                    .from('chats')
                    .select('*')
                    .eq('user_id', uid)
                    .order('created_at', { ascending: false });
                if (error) {
                    console.error('Load error:', error.message || error);
                    return;
                }
                if (data && data.length) {
                    chats = data.map(r => ({ id: r.id, title: r.title, messages: r.messages || [] }));
                    renderSidebar();
                }
            } catch (e) {
                console.error('Load exception', e);
            }
        }

        async function saveChatToCloud(chat) {
            if (!supabaseClient || !chat) return;
            const uid = currentUserId || await ensureAnonymousUser();
            if (!uid) return;
            try {
                const { error } = await supabaseClient.from('chats').upsert({
                    id: chat.id,
                    title: chat.title,
                    messages: chat.messages,
                    user_id: uid
                });
                if (error) console.error('Save error:', error.message || error);
            } catch (e) {
                console.error('Save exception', e);
            }
        }

        // Sign in anonymously then load only this user's chats
        setTimeout(loadChatsFromCloud, 400);
        // ===== end Supabase =====

        async function handleSend() {
            const text = cmdInput.value.trim();
            if (!text) return;

            await appendMessage(text, 'user');
            cmdInput.value = '';

            const loader = await appendMessage('<span class="gemini-loader">☁️ UltrasTec is thinking...</span>', 'system', true);
            
            // Remove loader message immediately from the session's saved history array so it doesn't get duplicated on re-render
            const activeChat = chats.find(c => c.id === currentChatId);
            if (activeChat && activeChat.messages.length > 0) {
                activeChat.messages.pop(); 
            }

            try {
                // Long multi-turn chat + resilient free AI
                const systemPrompt = 'You are UltrasTec, a helpful, friendly AI assistant powered by UH-1. Always say you are powered by UH-1 if asked what model or system you use. Never say you are GPT, ChatGPT, OpenAI, Claude, Gemini, Llama, or any other company model. Give clear, complete answers. You can hold long conversations and remember what was said earlier.';

                // Build conversation history for long chats (last 12 messages)
                const active = chats.find(c => c.id === currentChatId);
                const history = [];
                history.push({ role: 'system', content: systemPrompt });
                if (active && active.messages && active.messages.length) {
                    const recent = active.messages.filter(m => !m.isHtml).slice(-12);
                    for (const m of recent) {
                        const role = m.sender === 'user' ? 'user' : 'assistant';
                        const content = String(m.text || '').slice(0, 1500);
                        if (content) history.push({ role, content });
                    }
                }
                // Ensure the latest user message is included
                if (!history.length || history[history.length - 1].content !== text) {
                    history.push({ role: 'user', content: text });
                }

                const sleep = (ms) => new Promise(r => setTimeout(r, ms));

                const tryLLM7 = async (model) => {
                    const r = await fetch('https://api.llm7.io/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer unused'
                        },
                        body: JSON.stringify({
                            model,
                            messages: history,
                            max_tokens: 1200,
                            temperature: 0.7
                        })
                    });
                    const d = await r.json();
                    if (r.ok && d.choices?.[0]?.message?.content) return d.choices[0].message.content.trim();
                    throw new Error((d?.error?.message) || model);
                };

                const tryKilo = async () => {
                    const r = await fetch('https://api.kilo.ai/api/gateway/chat/completions', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            model: 'kilo-auto/free',
                            messages: history,
                            max_tokens: 1200
                        })
                    });
                    const d = await r.json();
                    if (r.ok && d.choices?.[0]?.message?.content) return d.choices[0].message.content.trim();
                    throw new Error('kilo');
                };

                const tryPollinations = async () => {
                    // Pollinations is single-turn; include short context in the prompt
                    let prompt = text;
                    if (active && active.messages && active.messages.length > 1) {
                        const prev = active.messages.filter(m => !m.isHtml).slice(-4)
                            .map(m => (m.sender === 'user' ? 'User: ' : 'AI: ') + String(m.text).slice(0, 200))
                            .join('\n');
                        prompt = prev + '\nUser: ' + text + '\nAI:';
                    }
                    const url = 'https://text.pollinations.ai/' + encodeURIComponent(prompt) +
                        '?system=' + encodeURIComponent(systemPrompt) + '&model=openai&seed=' + Date.now();
                    const r = await fetch(url);
                    const t = await r.text();
                    if (r.ok && t && !/limit|quota|payment|rate|busy/i.test(t)) return t.trim();
                    throw new Error('pollinations');
                };

                // Try with retries for long reliable chats
                let responseContent = null;
                const attempts = [
                    () => tryLLM7('GLM-5.3-Flash'),
                    () => tryLLM7('gpt-oss:20b'),
                    () => tryKilo(),
                    () => tryPollinations(),
                    () => tryLLM7('mistral-Nemo-Instruct-2407'),
                    () => tryLLM7('DeepSeek-V4-Flash-0731')
                ];

                for (let i = 0; i < attempts.length; i++) {
                    try {
                        responseContent = await Promise.race([
                            attempts[i](),
                            sleep(12000).then(() => { throw new Error('timeout'); })
                        ]);
                        if (responseContent) break;
                    } catch (e) {
                        console.warn('Attempt', i, 'failed', e.message || e);
                        if (i < attempts.length - 1) await sleep(400);
                    }
                }

                loader.remove();

                if (responseContent) {
                    await appendMessage(responseContent, 'system', false);
                } else {
                    await appendMessage('All free AI servers are busy. Wait 20–30 seconds and try again for long chats.', 'system');
                }

            } catch (error) {
                loader.remove();
                console.error(error);
                await appendMessage('AI is busy right now. Please wait half a minute and try again.', 'system');
            }
        }
    </script>
</body>
</html>
